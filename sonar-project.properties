# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud configuration for klein.php
# ─────────────────────────────────────────────────────────────────────────────
sonar.organization=matecat
sonar.projectKey=matecat_klein.php
sonar.projectName=klein.php

# Source & test directories
sonar.sources=src
sonar.tests=tests

# Exclusions (vendor, build artifacts, etc.)
sonar.exclusions=vendor/**,Benchmarks/**,docs/**,.github/**,.phpunit.cache/**

# PHP coverage – Clover XML produced by PHPUnit
sonar.php.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
